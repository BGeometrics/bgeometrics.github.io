<!DOCTYPE html>
<html>
<head>
    <title>Net Capital Flow</title>
</head>
<body>
    <link rel="stylesheet" type="text/css" href="../assets/css/stocktools/gui.css">
    <link rel="stylesheet" type="text/css" href="../assets/css/annotations/popup.css">
    <script src="../assets/stock/highstock.js"></script>
    <script src="../assets/stock/indicators/indicators-all.js"></script>
    <script src="../assets/stock/modules/drag-panes.js"></script>
    <script src="../assets/modules/annotations-advanced.js"></script>
    <script src="../assets/modules/price-indicator.js"></script>
    <script src="../assets/modules/full-screen.js"></script>
    <script src="../assets/modules/stock-tools.js"></script>
    <script src="../assets/stock/modules/heikinashi.js"></script>
    <script src="../assets/modules/accessibility.js"></script>
    <script src="../assets/js/bg-chart-data.js"></script>
    <script src="../assets/js/chart-upgrade-band.js"></script>



    <div id="container-iframe" style="width:100%; height:600px; margin: 0 auto;"></div>

    <script>
        // Net Capital Flow = NRPL + emision en USD: dinero que entra (+) o sale (-) de Bitcoin.
        (async () => {
            const F = 'https://charts.bgeometrics.com/files/';
            const data_price = await bgSeries('btc-price', F + 'net_capital_flow_btc_price.json');
            const data_1d = await bgSeries('capital-flows', F + 'net_capital_flow.json', 'netCapitalFlow1d');
            const data_7d = await bgSeries('capital-flows', F + 'net_capital_flow_7d.json', 'netCapitalFlow7d');
            const data_30d = await bgSeries('capital-flows', F + 'net_capital_flow_30d.json', 'netCapitalFlow30d');
            const data_90d = await bgSeries('capital-flows', F + 'net_capital_flow_90d.json', 'netCapitalFlow90d');

            const usd = (v) => {
                const a = Math.abs(v);
                if (a >= 1e9) return '$' + (v / 1e9).toFixed(a >= 1e10 ? 0 : 1) + 'B';
                if (a >= 1e6) return '$' + (v / 1e6).toFixed(0) + 'M';
                return '$' + v.toFixed(0);
            };
            const flowZones = [{ value: 0, color: '#e74c3c' }, { color: '#2ecc71' }];

        var chart = Highcharts.stockChart('container-iframe', {
            stockTools: {
                gui: {
                    buttons: ['linLogSwitch', 'separator', 'indicators', 'separator', 'simpleShapes', 'lines', 'crookedLines', 'measure', 'advanced', 'separator', 'verticalLabels', 'flags', 'separator', 'zoomChange', 'fullScreen', 'separator', 'currentPriceIndicator', 'toggleAnnotations'],
                    definitions: {
                        linLogSwitch: {
                            className: 'highcharts-lin-log-switch',
                            symbol: 'logarithmic.svg'
                        }
                    }
                }
            },
            navigation: {
                bindings: {
                    linLogSwitch: {
                        className: 'highcharts-lin-log-switch',
                        init: function (button) {
                            const chart = this.chart,
                                isLogarithmic = chart.yAxis[1].logarithmic,
                                axisTypeIcon = isLogarithmic ? 'logarithmic.svg' : 'linear.svg',
                                iconURL = '../assets/9.2.2/gfx/stock-icons/' + axisTypeIcon;

                            chart.yAxis[1].update({
                                type: isLogarithmic ? 'linear' : 'logarithmic',
                                minorTickInterval: isLogarithmic ? null : 'auto'
                            });

                            button.firstChild.style['background-image'] = `url(${iconURL})`;

                            Highcharts.fireEvent(
                                this,
                                'deselectButton',
                                { button: button }
                            );
                        }
                    }
                }
            },
            title: {
                text: '<a href="https://charts.bgeometrics.com">Bitcoin: Flujo Neto de Capital</a>',
                align: 'left',
            },

            chart: {
                renderTo: 'container-iframe',
                events: {
                    load: function() {
                        var image = new Image();
                        var adresse_image = "https://charts.bgeometrics.com/assets/img/BGeometrics_logo_write.png";
                        image.src = adresse_image;

                        var height_image = 128;
                        var width_image = 128;
                        var textX = this.plotLeft + (this.plotWidth * 0.5);
                        var textY = this.plotTop + (this.plotHeight * 0.5);
                        var position_x = textX - width_image / 2;
                        var position_y = textY - height_image / 2;
                        console.log(position_x + " " + position_y);
                        this.renderer.image(adresse_image, position_x, position_y, width_image, height_image)
                            .css({position: 'relative', "margin-left": "-90px", opacity: 0.1})
                            .attr({zIndex: 1})
                            .add();
                    }
                }
            },

            plotOptions:{
                series:{
                    showInLegend:true
                }
            },

            tooltip: {
                pointFormatter: function () {
                    const v = this.series.yAxis === this.series.chart.yAxis[1]
                        ? '$' + Highcharts.numberFormat(this.y, 2)
                        : usd(this.y);
                    return '<span style="color:' + this.color + '">●</span> ' + this.series.name + ': <b>' + v + '</b><br/>';
                }
            },

            yAxis: [{
                title: {
                    text: 'Flujo neto de capital (USD)'
                },
                labels: {
                    align: 'left',
                    formatter: function () { return usd(this.value); }
                },
                gridLineWidth: 0,
                plotLines: [{ value: 0, width: 1, color: '#888888', zIndex: 3 }]
            }, {
                title: {
                    text: 'Precio BTC'
                },
                gridLineWidth: 0,
                type: 'logarithmic',
                opposite: false
            }],

            series: [{
                id: 'Precio BTC',
                name: 'Precio BTC',
                color: 'white',
                data: data_price,
                yAxis: 1
            }, {
                id: 'net-capital-flow-30d',
                name: 'Flujo neto de capital 30D',
                type: 'area',
                data: data_30d,
                fillOpacity: 0.35,
                threshold: 0,
                zoneAxis: 'y',
                zones: flowZones,
                yAxis: 0
            }, {
                id: 'net-capital-flow-7d',
                name: 'Flujo neto de capital 7D',
                data: data_7d,
                color: '#f39c12',
                lineWidth: 1,
                yAxis: 0
            }, {
                id: 'net-capital-flow-90d',
                name: 'Flujo neto de capital 90D',
                data: data_90d,
                visible: false,
                color: '#3498db',
                lineWidth: 2,
                yAxis: 0
            }, {
                id: 'net-capital-flow-1d',
                name: 'Flujo neto de capital 1D',
                type: 'column',
                data: data_1d,
                visible: false,
                zoneAxis: 'y',
                zones: flowZones,
                yAxis: 0
            }],
            legend:{
                enabled:true,
                floating: true,
                y: 25,
                verticalAlign: 'top',
                align:'center'
            },

            rangeSelector: {
                selected: 5
            },

            credits: {
                text: 'Powered by BGeometrics.com',
                href: 'https://charts.bgeometrics.com',
                style: {
                    font: '11px sans-serif, Verdana, "Trebuchet MS"'
                },
                position: {
                    align: 'right',
                    x: -70,
                    y: -124
                }
            },
            responsive: {
                rules: [{
                    condition: {
                        maxWidth: 800
                    },
                    chartOptions: {
                        rangeSelector: {
                            inputEnabled: false
                        },
                        stockTools: {
                            gui: {
                                enabled: false
                            }
                        },
                        navigator: {
                            enabled: false
                        },
                        yAxis: [{
                            title: { text: null }
                        }, {
                            title: { text: null }
                        }],
                    }
                }]
            }
        });

        if (!bgIsSubscriber()) {
            addUpgradePlotBand(chart, 0, data_30d, {
                color: 'rgba(247,147,26,0.35)',
                label: 'Upgrade',
                url: 'https://portal.bgeometrics.com/pricing'
            });
        }
    })();
    </script>

</body>
</html>
