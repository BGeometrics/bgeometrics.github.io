<!DOCTYPE html>
<html>
<head>
    <title>Bitcoin Options Volatility</title>
</head>
<body>
    <link rel="stylesheet" type="text/css" href="../assets/css/stocktools/gui.css">
    <link rel="stylesheet" type="text/css" href="../assets/css/annotations/popup.css">
    <script src="../assets/stock/highstock.js"></script>
    <script src="../assets/stock/indicators/indicators-all.js"></script>
    <script src="../assets/stock/modules/drag-panes.js"></script>
    <script src="../assets/modules/annotations-advanced.js"></script>
    <script src="../assets/modules/price-indicator.js"></script>
    <script src="../assets/modules/full-screen.js"></script>
    <script src="../assets/modules/stock-tools.js"></script>
    <script src="../assets/stock/modules/heikinashi.js"></script>
    <script src="../assets/modules/accessibility.js"></script>
    <script src="../assets/js/bg-chart-data.js"></script>
    <script src="../assets/js/chart-upgrade-band.js"></script>



    <div id="container-iframe" style="width:100%; height:600px; margin: 0 auto;"></div>

    <script>
        (async () => {
            const data_price = await bgSeries(
                'btc-price', 'https://charts.bgeometrics.com/files/options_volatility_btc_price.json'
            );
            const data_upvol = await bgSeries(
                'upvol', 'https://charts.bgeometrics.com/files/options_volatility_upvol.json', 'upvol'
            );
            const data_downvol = await bgSeries(
                'downvol', 'https://charts.bgeometrics.com/files/options_volatility_downvol.json', 'downvol'
            );
            const data_skew = await bgSeries(
                'skew-index', 'https://charts.bgeometrics.com/files/options_volatility_skew.json', 'skewIndex'
            );

        var chart = Highcharts.stockChart('container-iframe', {
            stockTools: {
                gui: {
                    buttons: ['linLogSwitch', 'separator', 'indicators', 'separator', 'simpleShapes', 'lines', 'crookedLines', 'measure', 'advanced', 'separator', 'verticalLabels', 'flags', 'separator', 'zoomChange', 'fullScreen', 'separator', 'currentPriceIndicator', 'toggleAnnotations'],
                    definitions: {
                        linLogSwitch: {
                            className: 'highcharts-lin-log-switch',
                            symbol: 'logarithmic.svg'
                        }
                    }
                }
            },
            navigation: {
                bindings: {
                    linLogSwitch: {
                        className: 'highcharts-lin-log-switch',
                        init: function (button) {
                            const chart = this.chart,
                                isLogarithmic = chart.yAxis[1].logarithmic,
                                axisTypeIcon = isLogarithmic ? 'logarithmic.svg' : 'linear.svg',
                                iconURL = '../assets/9.2.2/gfx/stock-icons/' + axisTypeIcon;

                            chart.yAxis[1].update({
                                type: isLogarithmic ? 'linear' : 'logarithmic',
                                minorTickInterval: isLogarithmic ? null : 'auto'
                            });

                            button.firstChild.style['background-image'] = `url(${iconURL})`;

                            Highcharts.fireEvent(
                                this,
                                'deselectButton',
                                { button: button }
                            );
                        }
                    }
                }
            },
            title: {
                text: '<a href="https://charts.bgeometrics.com">Bitcoin: Options Volatility (UpVol / DownVol / Skew)</a>',
                align: 'left',
            },

            chart: {
                renderTo: 'container-iframe',
                events: {
                    load: function() {
                        var image = new Image();
                        var adresse_image = "https://charts.bgeometrics.com/assets/img/BGeometrics_logo.png";
                        image.src = adresse_image;

                        var height_image = 128;
                        var width_image = 128;
                        var textX = this.plotLeft + (this.plotWidth * 0.5);
                        var textY = this.plotTop + (this.plotHeight * 0.5);
                        var position_x = textX - width_image / 2;
                        var position_y = textY - height_image / 2;
                        this.renderer.image(adresse_image, position_x, position_y, width_image, height_image)
                            .css({position: 'relative', "margin-left": "-90px", opacity: 0.1})
                            .attr({zIndex: 1})
                            .add();
                    }
                }
            },

            plotOptions:{
                series:{
                    showInLegend:true
                }
            },

            yAxis: [{
                title: {
                    text: 'Vol (annualized %)'
                },
                labels: {
                    align: 'left',
                },
            }, {
                title: {
                    text: 'Precio BTC'
                },
                type: 'logarithmic',
                opposite: false
            }, {
                title: {
                    text: 'Skew (UpVol - DownVol)'
                },
                opposite: true
            }],

            series: [{
                id: 'Precio BTC',
                name: 'Precio BTC',
                color: 'black',
                data: data_price,
                tooltip: {
                    valueDecimals: 2
                },
                yAxis: 1
            }, {
                id:'UpVol',
                name: 'UpVol (call-side realized vol)',
                data: data_upvol,
                color: '#2ecc71',
                tooltip: {
                    valueDecimals: 2
                },
                yAxis: 0
            }, {
                id:'DownVol',
                name: 'DownVol (put-side realized vol)',
                data: data_downvol,
                color: '#e74c3c',
                tooltip: {
                    valueDecimals: 2
                },
                yAxis: 0
            }, {
                id:'Skew Index',
                name: 'Skew Index (UpVol - DownVol)',
                data: data_skew,
                color: '#9b59b6',
                visible: false,
                tooltip: {
                    valueDecimals: 2
                },
                yAxis: 2
            }],

            legend:{
                enabled:true,
                floating: true,
                y: 25,
                verticalAlign: 'top',
                align:'center'
            },

            rangeSelector: {
                buttons: [{
                    type: 'month',
                    count: 1,
                    text: '1m'
                }, {
                    type: 'month',
                    count: 3,
                    text: '3m'
                }, {
                    type: 'all',
                    text: 'All'
                }],
                selected: 1
            },

            credits: {
                text: 'Powered by BGeometrics.com',
                href: 'https://charts.bgeometrics.com',
                style: {
                    font: '11px sans-serif, Verdana, "Trebuchet MS"'
                },
                position: {
                    align: 'right',
                    x: -70,
                    y: -124
                }
            },
            responsive: {
                rules: [{
                    condition: {
                        maxWidth: 800
                    },
                    chartOptions: {
                        rangeSelector: {
                            inputEnabled: false
                        },
                        stockTools: {
                            gui: {
                                enabled: false
                            }
                        },
                        navigator: {
                            enabled: false
                        },
                        yAxis: [{
                            title: { text: null }
                        }, {
                            title: { text: null }
                        }, {
                            title: { text: null }
                        }],
                    }
                }]
            }
        });

        if (!bgIsSubscriber()) {
            addUpgradePlotBand(chart, 0, data_upvol, {
                color: 'rgba(247,147,26,0.35)',
                label: 'Upgrade',
                url: 'https://portal.bgeometrics.com/pricing'
            });
        }
    })();
    </script>

</body>
</html>
