<!DOCTYPE html>
<html>

<head>
    <title>Bitcoin Price</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../assets/css/stocktools/gui.css">
    <link rel="stylesheet" type="text/css" href="../assets/css/annotations/popup.css">
</head>

<body data-bs-theme="dark">
    <script src="../assets/stock/highstock.js"></script>
    <script src="../assets/stock/indicators/indicators-all.js"></script>
    <script src="../assets/stock/modules/drag-panes.js"></script>
    <script src="../assets/modules/annotations-advanced.js"></script>
    <script src="../assets/modules/price-indicator.js"></script>
    <script src="../assets/modules/full-screen.js"></script>
    <script src="../assets/modules/stock-tools.js"></script>
    <script src="../assets/stock/modules/heikinashi.js"></script>
    <script src="../assets/modules/accessibility.js"></script>

    

    <div id="container-iframe" style="width:100%; height:600px; margin: 0 auto;"></div>

    <div id="returns" class="d-flex justify-content-center my-3">
        <div class="vr mx-2"></div>
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-outline-secondary d-flex flex-column align-items-center py-1 px-3">
                <span class="small">Price now</span>
                <span class="fw-bold"></span>
            </button>
            <button class="btn btn-outline-secondary d-flex flex-column align-items-center py-1 px-3">
                <span class="small">24 h</span>
                <span class="fw-bold"></span>
            </button>
            <button class="btn btn-outline-secondary d-flex flex-column align-items-center py-1 px-3">
                <span class="small">1 week</span>
                <span class="fw-bold"></span>
            </button>
            <button class="btn btn-outline-secondary d-flex flex-column align-items-center py-1 px-3">
                <span class="small">1 month</span>
                <span class="fw-bold"></span>
            </button>
        </div>
        <div class="vr mx-2"></div>
    </div>
    <script>
        (async () => {
            const data_price = await fetch(
                'https://charts.bgeometrics.com/files/realized_price_btc_price.json'
            ).then(response => response.json());
            const data_ohlc = await fetch(
                'https://charts.bgeometrics.com/files/btc_ohlc_4h.json'
            ).then(response => response.json());
            const data_ohlc_1h = await fetch(
                'https://charts.bgeometrics.com/files/btc_ohlc_1h.json'
            ).then(response => response.json());
            const data_returns = await fetch(
                'https://charts.bgeometrics.com/files/btc_ohlc_return.json'
            ).then(response => response.json());

            // Actualizar los valores de retorno con estilos Bootstrap
            const returnButtons = document.querySelectorAll('#returns button');
            
            // Función para determinar el color basado en el valor
            const getButtonClass = (value) => {
                return value >= 0 ? 'text-success' : 'text-danger';
            };

            const oneYearAgo = new Date();
            oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
            const cutoffTimestamp = oneYearAgo.getTime();

            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7); // ahora sí es hace una semana
            const cutoffTimestampWeek = oneWeekAgo.getTime();

            // Parte 1: data_price hasta hace un año
            const data_price_until_year = data_price.filter(item => item[0] < cutoffTimestamp);

            // Parte 2: data_ohlc entre hace un año y hace una semana (solo cierre)
            const data_ohlc_from_year = data_ohlc
                .filter(item => item[0] >= cutoffTimestamp && item[0] < cutoffTimestampWeek)
                .map(item => [item[0], item[4]]);

            // Parte 3: data_ohlc_1h desde hace una semana
            const data_ohlc_from_week = data_ohlc_1h
                .filter(item => item[0] >= cutoffTimestampWeek)
                .map(item => [item[0], item[4]]);

            // Unión final
            const data_ohlc_all_1h = data_price_until_year
                .concat(data_ohlc_from_year)
                .concat(data_ohlc_from_week);

            var close_prices = data_ohlc_all_1h.map(item => {
                if (item.length === 2) return [item[0], item[1]];
                return [item[0], item[4]];
            });

            const lastPrice = close_prices.length > 0 ? close_prices[close_prices.length - 1][1] : null;

            var chart = Highcharts.stockChart('container-iframe', {
                stockTools: {
                    gui: {
                        buttons: ['linLogSwitch', 'separator', 'indicators', 'separator', 'simpleShapes', 'lines', 'crookedLines', 'measure', 'advanced', 'separator', 'verticalLabels', 'flags', 'separator', 'zoomChange', 'fullScreen', 'separator', 'currentPriceIndicator', 'toggleAnnotations'],
                        definitions: {
                            linLogSwitch: {
                                className: 'highcharts-lin-log-switch',
                                symbol: 'logarithmic.svg'
                            }
                        }
                    }
                },
                navigation: {
                    bindings: {
                        linLogSwitch: {
                            className: 'highcharts-lin-log-switch',
                            init: function (button) {
                                const chart = this.chart,
                                    isLogarithmic = chart.yAxis[1].logarithmic,
                                    axisTypeIcon = isLogarithmic ? 'logarithmic.svg' : 'linear.svg',
                                    iconURL = '../assets/9.2.2/gfx/stock-icons/' + axisTypeIcon;

                                chart.yAxis[0].update({
                                    type: isLogarithmic ? 'linear' : 'logarithmic',
                                    minorTickInterval: isLogarithmic ? null : 'auto'
                                }, false)
                                chart.yAxis[1].update({
                                    type: isLogarithmic ? 'linear' : 'logarithmic',
                                    minorTickInterval: isLogarithmic ? null : 'auto'
                                });

                                button.firstChild.style['background-image'] = `url(${iconURL})`;

                                Highcharts.fireEvent(
                                    this,
                                    'deselectButton',
                                    { button: button }
                                );
                            }
                        }
                    }
                },
                title: {
                    text: 'Bitcoin and Ethereum price (USD)',
                    align: 'left',
                },

                chart: {
                    renderTo: 'container-iframe',
                    events: {
                        load: function () {
                            var image = new Image();
                            var adresse_image = "https://charts.bgeometrics.com/assets/img/BGeometrics_logo.png";
                            image.src = adresse_image;

                            var height_image = 128;
                            var width_image = 128;
                            var textX = this.plotLeft + (this.plotWidth * 0.5);
                            var textY = this.plotTop + (this.plotHeight * 0.5);
                            var position_x = textX - width_image / 2;
                            var position_y = textY - height_image / 2;
                            console.log(position_x + " " + position_y);
                            this.renderer.image(adresse_image, position_x, position_y, width_image, height_image)
                                .css({ position: 'relative', "margin-left": "-90px", opacity: 0.1 })
                                .attr({ zIndex: 1 })
                                .add();
                        }
                    }
                },

                stockTools: {
                    gui: {
                        enabled: false 
                    }
                },

                plotOptions: {
                    series: {
                        showInLegend: true
                    }
                },

                yAxis: [{
                    labels: {
                        align: 'left',
                    },
                    title: {
                        text: ''
                    },
                }, {
                    gridLineWidth: 0,
                    opposite: false,
                    labels: {
                        align: 'right',
                        style: { color: '#627EEA' }
                    },
                    title: {
                        text: 'ETH',
                        style: { color: '#627EEA' }
                    },
                }],

                series: [
                    {
                        id: 'Precio BTC',
                        name: 'Precio BTC',
                        color: 'black',
                        data: close_prices,
                        tooltip: {
                            valuePrefix: '$',
                            valueDecimals: 2
                        },
                        yAxis: 0
                    },
                ],

                legend: {
                    enabled: true,
                },

                rangeSelector: {
                    selected: 1,
                    buttons: [{
                        type: 'day',
                        count: 1,
                        text: '1d'
                    }, {
                        type: 'week',
                        count: 1,
                        text: '1w'
                    }, {
                        type: 'month',
                        count: 1,
                        text: '1m'
                    }, {
                        type: 'month',
                        count: 3,
                        text: '3m'
                    }, {
                        type: 'month',
                        count: 6,
                        text: '6m'
                    }, {
                        type: 'year',
                        count: 1,
                        text: '1y'
                    }, {
                        type: 'all',
                        text: 'All'
                    }]
                },

                credits: {
                    text: 'Powered by BGeometrics.com',
                    href: 'https://charts.bgeometrics.com',
                    style: {
                        font: '11px sans-serif, Verdana, "Trebuchet MS"'
                    },
                    position: {
                        align: 'right',
                        x: -60,
                        y: -85
                    }
                },
                responsive: {
                    rules: [{
                        condition: {
                            maxWidth: 800
                        },
                        chartOptions: {
                            rangeSelector: {
                                inputEnabled: false
                            },
                            stockTools: {
                                gui: {
                                    enabled: false
                                }
                            },
                            navigator: {
                                enabled: false
                            },
                            yAxis: [{
                                title: { text: null }
                            }, {
                                title: { text: null }
                            }],
                        }
                    }]
                }
            });

            console.log(data_returns)
            returnButtons[0].querySelectorAll('span')[1].textContent = '$' + lastPrice.toFixed(0);
            returnButtons[0].querySelectorAll('span')[1].className = `fw-bold ${getButtonClass(lastPrice)}`;
            
            returnButtons[1].querySelectorAll('span')[1].textContent = data_returns.last_24h.toFixed(2) + '%';
            returnButtons[1].querySelectorAll('span')[1].className = `fw-bold ${getButtonClass(data_returns.last_24h)}`;
            
            returnButtons[2].querySelectorAll('span')[1].textContent = data_returns.last_week.toFixed(2) + '%';
            returnButtons[2].querySelectorAll('span')[1].className = `fw-bold ${getButtonClass(data_returns.last_week)}`;
            
            returnButtons[3].querySelectorAll('span')[1].textContent = data_returns.last_month.toFixed(2) + '%';
            returnButtons[3].querySelectorAll('span')[1].className = `fw-bold ${getButtonClass(data_returns.last_month)}`;
            
            // ETH en eje propio: cierre diario hasta hace un año, velas 4h de Binance el último año
            // y 1h la última semana (misma resolución que BTC). Si Binance falla, solo el diario.
            const binanceKlines = async (interval, startMs, endMs) => {
                const out = [];
                let start = startMs;
                while (start <= endMs) {
                    const url = 'https://data-api.binance.vision/api/v3/klines?symbol=ETHUSDT&interval=' + interval +
                        '&startTime=' + start + '&endTime=' + endMs + '&limit=1000';
                    const rows = await fetch(url).then(r => {
                        if (!r.ok) throw new Error('Binance ' + r.status);
                        return r.json();
                    });
                    rows.forEach(k => out.push([k[0], parseFloat(k[4])]));
                    if (rows.length < 1000) break;
                    start = rows[rows.length - 1][0] + 1;
                }
                return out;
            };

            const eth_daily = await fetch(
                'https://charts.bgeometrics.com/files/eth_price_full.json'
            ).then(response => response.json()).catch(() => []);

            let eth_prices = eth_daily;
            try {
                const [eth_4h, eth_1h] = await Promise.all([
                    binanceKlines('4h', cutoffTimestamp, cutoffTimestampWeek - 1),
                    binanceKlines('1h', cutoffTimestampWeek, Date.now())
                ]);
                eth_prices = eth_daily.filter(item => item[0] < cutoffTimestamp).concat(eth_4h, eth_1h);
            } catch (e) {
                console.warn('ETH intradía no disponible, se usa el cierre diario', e);
            }

            if (eth_prices.length > 0) {
                chart.addSeries({
                    id: 'Precio ETH',
                    name: 'Precio ETH',
                    color: '#627EEA',
                    lineWidth: 1.5,
                    data: eth_prices,
                    tooltip: {
                        valuePrefix: '$',
                        valueDecimals: 2
                    },
                    yAxis: 1
                });
            }

        })();

    </script>

</body>

</html>
