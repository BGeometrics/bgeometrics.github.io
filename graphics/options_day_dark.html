<!DOCTYPE html>
<html>
<head>
    <title>Bitcoin Options Day</title>
</head>
<body>
    <link rel="stylesheet" type="text/css" href="../assets/css/stocktools/gui.css">
    <link rel="stylesheet" type="text/css" href="../assets/css/annotations/popup.css">
    <script src="../assets/stock/highstock.js"></script>
    <script src="../assets/stock/indicators/indicators-all.js"></script>
    <script src="../assets/stock/modules/drag-panes.js"></script>
    <script src="../assets/modules/annotations-advanced.js"></script>
    <script src="../assets/modules/price-indicator.js"></script>
    <script src="../assets/modules/full-screen.js"></script>
    <script src="../assets/modules/stock-tools.js"></script>
    <script src="../assets/stock/modules/heikinashi.js"></script>
    <script src="../assets/modules/accessibility.js"></script>
    <script src="../assets/js/bg-chart-data.js"></script>
    <script src="../assets/js/chart-upgrade-band.js"></script>
    <script src="../assets/themes/brand-dark.js"></script>
    <!--<link rel="stylesheet" type="text/css" href="../assets/css/highcharts-dark.css">-->
    <style>
        :root {
            --highcharts-neutral-color-3: #000000;
        }

        .highcharts-contextbutton .highcharts-button-symbol {
            stroke: #000000 !important;
            fill: #000000 !important;
        }

        .highcharts-menu-item {
            background-color: #000000 !important;
            color: #FFFFFF !important;
        }

        .highcharts-menu {
            background-color: #000000 !important;
            border: 1px solid #ccc !important;
            color: #dddddd !important;
        }

        .highcharts-popup input[type="text"],
        .highcharts-popup input[type="number"],
        .highcharts-popup select,
        .highcharts-annotation-toolbar input {
            background-color: #FFFFFF !important;
            color: #000000 !important;
        }
    </style>



    <div id="container-iframe" style="width:100%; height:600px; margin: 0 auto;"></div>

    <script>
        (async () => {
            const data_price = await bgSeries(
                'btc-price', 'https://charts.bgeometrics.com/files/options_day_btc_price.json'
            );
            const data_pcvol = await bgSeries(
                'options-day', 'https://charts.bgeometrics.com/files/options_day_pcvol.json', 'putCallVolRatio'
            );
            const data_iv = await bgSeries(
                'options-day', 'https://charts.bgeometrics.com/files/options_day_iv.json', 'atmIv'
            );
            const data_callvol = await bgSeries(
                'options-day', 'https://charts.bgeometrics.com/files/options_day_callvol.json', 'totalCallVol'
            );
            const data_putvol = await bgSeries(
                'options-day', 'https://charts.bgeometrics.com/files/options_day_putvol.json', 'totalPutVol'
            );

        var chart = Highcharts.stockChart('container-iframe', {
            stockTools: {
                gui: {
                    buttons: ['linLogSwitch', 'separator', 'indicators', 'separator', 'simpleShapes', 'lines', 'crookedLines', 'measure', 'advanced', 'separator', 'verticalLabels', 'flags', 'separator', 'zoomChange', 'fullScreen', 'separator', 'currentPriceIndicator', 'toggleAnnotations'],
                    definitions: {
                        linLogSwitch: {
                            className: 'highcharts-lin-log-switch',
                            symbol: 'logarithmic.svg'
                        }
                    }
                }
            },
            navigation: {
                bindings: {
                    linLogSwitch: {
                        className: 'highcharts-lin-log-switch',
                        init: function (button) {
                            const chart = this.chart,
                                isLogarithmic = chart.yAxis[1].logarithmic,
                                axisTypeIcon = isLogarithmic ? 'logarithmic.svg' : 'linear.svg',
                                iconURL = '../assets/9.2.2/gfx/stock-icons/' + axisTypeIcon;

                            chart.yAxis[1].update({
                                type: isLogarithmic ? 'linear' : 'logarithmic',
                                minorTickInterval: isLogarithmic ? null : 'auto'
                            });

                            button.firstChild.style['background-image'] = `url(${iconURL})`;

                            Highcharts.fireEvent(
                                this,
                                'deselectButton',
                                { button: button }
                            );
                        }
                    }
                }
            },
            title: {
                text: '<a href="https://charts.bgeometrics.com">Bitcoin: Options Day</a>',
                align: 'left',
            },

            chart: {
                renderTo: 'container-iframe',
                backgroundColor: 'black',
                events: {
                    load: function() {
                        var image = new Image();
                        var adresse_image = "https://charts.bgeometrics.com/assets/img/BGeometrics_logo_write.png";
                        image.src = adresse_image;

                        var height_image = 128;
                        var width_image = 128;
                        var textX = this.plotLeft + (this.plotWidth * 0.5);
                        var textY = this.plotTop + (this.plotHeight * 0.5);
                        var position_x = textX - width_image / 2;
                        var position_y = textY - height_image / 2;
                        this.renderer.image(adresse_image, position_x, position_y, width_image, height_image)
                            .css({position: 'relative', "margin-left": "-90px", opacity: 0.3})
                            .attr({zIndex: 1})
                            .add();
                    }
                }
            },

            plotOptions:{
                series:{
                    showInLegend:true
                }
            },

            yAxis: [{
                title: {
                    text: 'Put/Call Vol Ratio & ATM IV'
                },
                labels: {
                    align: 'left',
                },
            }, {
                title: {
                    text: 'BTC price'
                },
                type: 'logarithmic',
                opposite: false
            }, {
                title: {
                    text: 'Volume (contracts)'
                },
                opposite: true
            }],

            series: [{
                id: 'BTC price',
                name: 'BTC price',
                color: 'white',
                data: data_price,
                tooltip: {
                    valueDecimals: 2
                },
                yAxis: 1
            }, {
                id:'Put/Call Volume Ratio',
                name: 'Put/Call Volume Ratio',
                data: data_pcvol,
                color: '#9b59b6',
                tooltip: {
                    valueDecimals: 3
                },
                yAxis: 0
            }, {
                id:'ATM Implied Volatility',
                name: 'ATM Implied Volatility',
                data: data_iv,
                color: '#e67e22',
                tooltip: {
                    valueDecimals: 3
                },
                yAxis: 0
            }, {
                id:'Total Call Volume',
                name: 'Total Call Volume',
                data: data_callvol,
                color: '#2ecc71',
                visible: false,
                tooltip: {
                    valueDecimals: 2
                },
                yAxis: 2
            }, {
                id:'Total Put Volume',
                name: 'Total Put Volume',
                data: data_putvol,
                color: '#e74c3c',
                visible: false,
                tooltip: {
                    valueDecimals: 2
                },
                yAxis: 2
            }],

            legend:{
                enabled:true,
                floating: true,
                y: 25,
                verticalAlign: 'top',
                align:'center'
            },

            rangeSelector: {
                buttons: [{
                    type: 'month',
                    count: 1,
                    text: '1m'
                }, {
                    type: 'month',
                    count: 3,
                    text: '3m'
                }, {
                    type: 'all',
                    text: 'All'
                }],
                selected: 3
            },

            credits: {
                text: 'Powered by BGeometrics.com',
                href: 'https://charts.bgeometrics.com',
                style: {
                    font: '11px sans-serif, Verdana, "Trebuchet MS"'
                },
                position: {
                    align: 'right',
                    x: -70,
                    y: -124
                }
            },
            responsive: {
                rules: [{
                    condition: {
                        maxWidth: 800
                    },
                    chartOptions: {
                        rangeSelector: {
                            inputEnabled: false
                        },
                        stockTools: {
                            gui: {
                                enabled: false
                            }
                        },
                        navigator: {
                            enabled: false
                        },
                        yAxis: [{
                            title: { text: null }
                        }, {
                            title: { text: null }
                        }, {
                            title: { text: null }
                        }],
                    }
                }]
            }
        });

        if (!bgIsSubscriber()) {
            addUpgradePlotBand(chart, 0, data_pcvol, {
                color: 'rgba(247,147,26,0.35)',
                label: 'Upgrade',
                url: 'https://portal.bgeometrics.com/pricing'
            });
        }
    })();
    </script>

</body>
</html>
