<!DOCTYPE html>
<html>
<head>
    <title>Bitcoin Liquidation Heatmap</title>
</head>
<body>
    <link rel="stylesheet" type="text/css" href="../assets/css/stocktools/gui.css">
    <link rel="stylesheet" type="text/css" href="../assets/css/annotations/popup.css">
    <script src="../assets/highcharts.js"></script>
    <script src="../assets/modules/data.js"></script>
    <script src="../assets/modules/heatmap.js"></script>
    <script src="../assets/modules/export-data.js"></script>
    <script src="../assets/modules/accessibility.js"></script>
    <script src="../assets/themes/brand-dark.js"></script>
    <!--<link rel="stylesheet" type="text/css" href="../assets/css/highcharts-dark.css">-->
    <style>
        :root {
            --highcharts-neutral-color-3: #000000;
        }

        .highcharts-contextbutton .highcharts-button-symbol {
            stroke: #000000 !important; 
            fill: #000000 !important; 
        }

        .highcharts-menu-item { 
            background-color: #000000 !important; 
            color: #FFFFFF !important; 
        }   

        .highcharts-menu {
            background-color: #000000 !important; 
            border: 1px solid #ccc !important;
            color: #dddddd !important; 
        }

        .highcharts-popup input[type="text"],
        .highcharts-popup input[type="number"],
        .highcharts-popup select,
        .highcharts-annotation-toolbar input {
            background-color: #FFFFFF !important;
            color: #000000 !important;
        }
    </style>

    <div style="text-align:center; margin-bottom: 8px;">
        <button type="button" class="bg-heatmap-range" data-variant="">Full</button>
        <button type="button" class="bg-heatmap-range" data-variant="_30d">30d</button>
        <button type="button" class="bg-heatmap-range" data-variant="_7d">7d</button>
    </div>

    <div id="container" style="height: 600px; width: 100%; margin: 0 auto"></div>

    <script>
        (() => {
            let chart = null;

            function render(json) {
                const hasGap = Array.isArray(json.gap_x_range);

                const chartOptions = {
                    chart: {
                        type: 'heatmap', backgroundColor: '#000000',
                    },

                    title: {
                        text: '<a href="https://charts.bgeometrics.com/btc_liquidations.html" target="_blank">BTC Liquidation Heatmap</a>',
                        align: 'left',
                        style: {
                            fontSize: '14px', color: '#FFFFFF',
                        }
                    },

                    xAxis: {
                        categories: json.categories_x,
                        labels: {
                            rotation: -45
                        },
                        plotBands: hasGap ? [{
                            from: json.gap_x_range[0] - 0.5,
                            to: json.gap_x_range[1] + 0.5,
                            label: {
                                text: 'WebSocket down',
                                style: { color: '#7f7f7f' }
                            }
                        }] : []
                    },

                    yAxis: {
                        categories: json.categories_y_label,
                        title: {
                            text: 'BTC price (USD)'
                        },
                        reversed: false
                    },

                    colorAxis: {
                        min: 0,
                        stops: [
                            [0, '#2c3e50'],
                            [0.25, '#2980b9'],
                            [0.5, '#f39c12'],
                            [0.8, '#e74c3c'],
                            [1.0, '#c0392b']
                        ],
                        nullColor: '#7f7f7f',
                        startOnTick: false,
                        endOnTick: false
                    },

                    legend: {
                        enabled: true,
                        title: {
                            text: 'USD liquidated'
                        }
                    },

                    tooltip: {
                        formatter: function () {
                            if (this.point.value == null) {
                                return '<b>No data</b><br>' + this.series.xAxis.categories[this.point.x];
                            }
                            return '<b>' + Highcharts.numberFormat(this.point.value, 0) + ' USD liquidated</b><br>' +
                                this.series.xAxis.categories[this.point.x] + '<br>' +
                                this.series.yAxis.categories[this.point.y];
                        }
                    },

                    series: [{
                        name: 'Liquidations (USD)',
                        data: json.data,
                        borderWidth: 0,
                        nullColor: '#7f7f7f'
                    }],

                    credits: {
                        enabled: false
                    },

                    responsive: {
                        rules: [{
                            condition: {
                                maxWidth: 500
                            },
                            chartOptions: {
                                yAxis: {
                                    labels: {
                                        enabled: false
                                    }
                                }
                            }
                        }]
                    }
                };

                if (chart) {
                    chart.update(chartOptions, true, true);
                } else {
                    chart = Highcharts.chart('container', chartOptions);
                }
            }

            function load(variant) {
                fetch('https://charts.bgeometrics.com/files/btc_liquidations_heatmap' + variant + '.json')
                    .then(response => response.json())
                    .then(render);
            }

            document.querySelectorAll('.bg-heatmap-range').forEach(btn => {
                btn.addEventListener('click', () => load(btn.dataset.variant));
            });

            load('');
        })();
    </script>

</body>
</html>
