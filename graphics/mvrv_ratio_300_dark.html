    <script>

    function decoder(encoded) {
        const compressed = atob(encoded);
        const charData = compressed.split('').map(x => x.charCodeAt(0));
        const binData = new Uint8Array(charData);
        const data = pako.inflate(binData);
        const str = String.fromCharCode.apply(null, new Uint8Array(data));
        return JSON.parse(str);
    }

        (async () => {
            const data_mvrv = await bgSeries('mvrv', 'https://charts.bgeometrics.com/files/mvrv_data.json');
            const data_price = await bgSeries('btc-price', 'https://charts.bgeometrics.com/files/mvrv_zscore_btc_price.json');
            const data_mvrv_365sma = bgIsSubscriber()
                ? bgRollingMean(data_mvrv, 365)
                : await fetch('https://charts.bgeometrics.com/files/mvrv_365dma.json').then(response => response.json());

        var chart = Highcharts.stockChart('container-iframe', {
            stockTools: {
                gui: {

            navigation: {

                        className: 'highcharts-lin-log-switch',
                        init: function (button) {
                            const chart = this.chart,
                                isLogarithmic = chart.yAxis[1].logarithmic,
                                axisTypeIcon = isLogarithmic ? 'logarithmic.svg' : 'linear.svg',
                                iconURL = '../assets/9.2.2/gfx/stock-icons/' + axisTypeIcon;

                            chart.yAxis[0].update({
                                type: isLogarithmic ? 'linear' : 'logarithmic',
                                minorTickInterval: isLogarithmic ? null : 'auto'
                            });

                            chart.yAxis[1].update({
                                type: isLogarithmic ? 'linear' : 'logarithmic',
                                minorTickInterval: isLogarithmic ? null : 'auto'
                            });

                            button.firstChild.style['background-image'] = `url(${iconURL})`;

                            Highcharts.fireEvent(
                                this,
                                'deselectButton',
                                { button: button }
                            );
                        }
                    }
                }
            },

            chart: {
